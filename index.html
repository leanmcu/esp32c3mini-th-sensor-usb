<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeanMCU | Web Flasher</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
        p { color: #64748b; margin-bottom: 2rem; line-height: 1.5; }
        
        /* Styling the Custom Element Button */
        esp-web-install-button {
            --esp-tools-button-border-radius: 8px;
            --esp-tools-button-color: var(--primary-color);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LeanMCU Flasher</h1>
    <p>Connect your ESP32-C3 via USB. <br>Use Chrome or Edge to begin the one-click installation.</p>

    <esp-web-install-button manifest="manifest.json">
        <button slot="activate" style="padding: 12px 24px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600;">
            CONNECT & FLASH
        </button>
    </esp-web-install-button>

    <div class="footer">
        &copy; 2026 LeanMCU Digital Ecosystem
    </div>
</div>

</body>
</html>
